# Builds the application and runs the automated business-rule tests on every change.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore SecureEmployeePortal.csproj

      - name: Build application
        run: dotnet build SecureEmployeePortal.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run automated tests
        run: >-
          dotnet test tests/SecureEmployeePortal.Tests/SecureEmployeePortal.Tests.csproj
          --configuration Release
          -p:TreatWarningsAsErrors=true
          --logger "trx;LogFileName=release-gate.trx"
          --results-directory TestResults

      - name: Verify automated test inventory
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          expected = 74
          counters = next(
              (element for element in ET.parse("TestResults/release-gate.trx").iter()
               if element.tag.endswith("Counters")),
              None,
          )
          if counters is None:
              raise SystemExit("TRX result did not contain a Counters element.")

          total = int(counters.attrib.get("total", "0"))
          passed = int(counters.attrib.get("passed", "0"))
          failed = int(counters.attrib.get("failed", "0"))

          if total != expected:
              raise SystemExit(
                  f"Automated test inventory changed: expected {expected} executions, discovered {total}."
              )
          if passed != expected or failed != 0:
              raise SystemExit(
                  f"Automated test gate failed: expected {expected} passed / 0 failed, "
                  f"got {passed} passed / {failed} failed."
              )

          print(f"Verified automated test inventory: {passed}/{expected} passed.")
          PY

      - name: Verify EF Core model matches migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet ef migrations has-pending-model-changes --project SecureEmployeePortal.csproj
