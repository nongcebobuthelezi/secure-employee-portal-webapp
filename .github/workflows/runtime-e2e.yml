name: runtime-e2e

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-e2e.yml"
      - "scripts/runtime-e2e.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-backed-browser-journey:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      SeedAdmin__Email: e2e.admin@secureportal.test
      E2E_ADMIN_EMAIL: e2e.admin@secureportal.test
      E2E_EMPLOYEE_EMAIL: nandi.employee@secureportal.test
      PORTAL_BASE_URL: http://127.0.0.1:5080
      E2E_OUTPUT_DIR: artifacts/runtime-evidence

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.301"

      - name: Restore and Release-build portal
        run: |
          dotnet restore SecureEmployeePortal.csproj
          dotnet build SecureEmployeePortal.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Start isolated SQL Server
        shell: bash
        run: |
          set -euo pipefail
          E2E_PASS="Aa1!$(python -c 'import secrets; print(secrets.token_hex(18))')"
          echo "::add-mask::$E2E_PASS"
          {
            echo "E2E_PASS=$E2E_PASS"
            echo "E2E_ADMIN_PASSWORD=$E2E_PASS"
            echo "E2E_EMPLOYEE_PASSWORD=$E2E_PASS"
            echo "SeedAdmin__Password=$E2E_PASS"
            echo "PORTAL_CONNECTION=Server=127.0.0.1,1433;Database=SecureEmployeePortalE2E;User Id=sa;Password=$E2E_PASS;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
          } >> "$GITHUB_ENV"

          docker run -d --name portal-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$E2E_PASS" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        shell: bash
        run: |
          python - <<'PY'
          import socket, time
          deadline = time.time() + 90
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 1433), timeout=2):
                      print("SQL Server TCP endpoint is accepting connections.")
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server did not open port 1433 within 90 seconds.")
          PY
          sleep 8

      - name: Start portal and wait for health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-evidence
          export ConnectionStrings__DefaultConnection="$PORTAL_CONNECTION"
          dotnet run --project SecureEmployeePortal.csproj --configuration Release --no-build --urls "$ASPNETCORE_URLS" > artifacts/runtime-evidence/app.log 2>&1 &
          echo $! > artifacts/runtime-evidence/app.pid

          for attempt in {1..75}; do
            if curl -fsS "$PORTAL_BASE_URL/health" >/dev/null; then
              echo "Portal health endpoint is ready."
              exit 0
            fi

            if ! kill -0 "$(cat artifacts/runtime-evidence/app.pid)" 2>/dev/null; then
              echo "Portal exited before becoming healthy."
              cat artifacts/runtime-evidence/app.log
              exit 1
            fi

            sleep 2
          done

          echo "Portal did not become healthy within the timeout."
          cat artifacts/runtime-evidence/app.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run real browser journey and capture runtime screenshots
        run: python scripts/runtime-e2e.py

      - name: Show portal log tail
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/runtime-evidence/app.log ]; then
            tail -n 160 artifacts/runtime-evidence/app.log
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-employee-portal-runtime-evidence
          path: artifacts/runtime-evidence
          if-no-files-found: error
          retention-days: 14
