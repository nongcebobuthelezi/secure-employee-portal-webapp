name: Seed isolated portal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4

      - name: Copy the protected public baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nongcebobuthelezi/secure-employee-portal.git /tmp/source
          cp -R /tmp/source/. .
          rm -rf .git
          git init
          git branch -M main
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: seed protected portal baseline"
          git push -u origin main --force
